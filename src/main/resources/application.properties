spring.application.name=kafka-spring-cloud-stream
server.address=127.0.0.1
server.port=8081
spring.cloud.stream.kafka.binder.brokers=localhost:9092

spring.cloud.function.definition=logVisits;generateVisits
spring.cloud.stream.output-bindings=publishVisit-out-0
spring.cloud.stream.bindings.publishVisit-out-0.destination=T2
spring.cloud.stream.bindings.logVisits-in-0.destination=T2
spring.cloud.stream.bindings.logVisits-in-0.group=tp-page-visits
spring.cloud.stream.bindings.generateVisits-out-0.destination=T3
spring.cloud.stream.bindings.generateVisits-out-0.producer.poller.fixed-delay=${PAGE_EVENT_DELAY_MS:200}
spring.cloud.stream.kafka.bindings.publishVisit-out-0.producer.sync=true
spring.cloud.stream.kafka.bindings.generateVisits-out-0.producer.sync=true
